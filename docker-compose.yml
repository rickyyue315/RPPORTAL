services:
  db:
    image: postgres:16-alpine
    container_name: ndrf-db
    environment:
      POSTGRES_USER: ndrf
      POSTGRES_PASSWORD: ndrf
      POSTGRES_DB: ndrf
    ports:
      - "5432:5432"
    volumes:
      - ndrf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndrf"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: ndrf-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ndrf:ndrf@db:5432/ndrf
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: local-dev-password-change-me
      TRUST_PROXY: "true"
      PUBLIC_WRITE_SUSPENSION_ENABLED: "true"
      PUBLIC_WRITE_SUSPENSION_AT: "2026-08-11T23:59:59+08:00"
      # 前台 Portal 暫時免密碼（店舖／Buyer／SCT 只需使用者名稱）；還原時改回 "false"。
      # 後台 Admin 不受影響，仍須密碼。
      PORTAL_AUTH_BYPASS: "true"
    ports:
      - "3000:3000"

volumes:
  ndrf_pgdata:
