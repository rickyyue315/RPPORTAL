<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5;url=/portal/store.html">
  <title>NDRF Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/portal/css/portal.css">
</head>
<body class="portal-login-body">
  <main class="portal-login-card">
    <h1>NDRF 申報 Portal</h1>
    <p class="hint">載入中…</p>
  </main>

  <script src="/portal/js/portal.js"></script>
  <script>
    // No login page: everyone enters through the store gate.
    // Links with ?user= log in automatically and land on the role homepage.
    (() => {
      const search = window.location.search || '';
      let name = '';
      try {
        name = (new URLSearchParams(search).get('user') || '').trim();
      } catch {}
      const goStore = () => window.location.replace('/portal/store.html' + search);
      if (!name) {
        goStore();
        return;
      }
      portal.api('/api/portal/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username: name }),
      }).then((data) => {
        const role = data && data.user && data.user.role;
        if (role === 'buyer' || role === 'sct') {
          window.location.replace('/portal/reviewer.html' + search);
        } else {
          goStore();
        }
      }).catch(goStore);
    })();
  </script>
</body>
</html>
