<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">行貨退貨預覽及提交</title>
  <desc id="desc">核對退貨資料後確認提交並記下 RETURN 開頭的申請編號</desc>
  <rect width="640" height="360" rx="16" fill="#f4f7fa"/>
  <rect x="42" y="28" width="556" height="304" rx="12" fill="#fff" stroke="#d9dee3"/>
  <text x="70" y="70" fill="#0a3d69" font-family="Arial, sans-serif" font-size="19" font-weight="700">提交預覽</text>
  <line x1="70" y1="88" x2="570" y2="88" stroke="#d9dee3" stroke-width="2"/>
  <text x="72" y="123" fill="#66727f" font-family="Arial, sans-serif" font-size="14">Site Code / SKU</text>
  <text x="260" y="123" fill="#1d2733" font-family="Arial, sans-serif" font-size="15" font-weight="700">HA02 / 123456789</text>
  <text x="72" y="156" fill="#66727f" font-family="Arial, sans-serif" font-size="14">QTY / REASON</text>
  <text x="260" y="156" fill="#1d2733" font-family="Arial, sans-serif" font-size="15">8 / BUYER MEMO 指定退貨</text>
  <rect x="72" y="210" width="190" height="48" rx="24" fill="#0f5c9c"/>
  <text x="113" y="240" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">確認提交</text>
  <rect x="282" y="210" width="150" height="48" rx="24" fill="#eef1f4"/>
  <text x="322" y="240" fill="#1d2733" font-family="Arial, sans-serif" font-size="15">返回修改</text>
  <rect x="72" y="278" width="360" height="30" rx="6" fill="#eafaf1"/>
  <text x="86" y="298" fill="#1e8449" font-family="Arial, sans-serif" font-size="13" font-weight="700">RETURN-202608-000123</text>
  <circle cx="520" cy="234" r="28" fill="#eafaf1" stroke="#1e8449" stroke-width="3"/>
  <path d="m506 234 10 10 19-22" fill="none" stroke="#1e8449" stroke-width="5"/>
</svg>
