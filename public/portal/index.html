<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDRF Portal 登入</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/portal/css/portal.css">
</head>
<body class="portal-login-body">
  <main class="portal-login-card">
    <h1>NDRF 申報 Portal</h1>
    <p class="hint">免密碼登入：只需輸入使用者名稱（店舖 Site Code／Buyer／SCT 帳戶）即可進入。</p>
    <div id="login_error"></div>
    <form id="login_form">
      <label for="username">使用者名稱</label>
      <input type="text" id="username" autocomplete="username" placeholder="例如 HA02 / BUYER1">
      <div class="btn-row" style="margin-top:16px">
        <button class="btn" type="submit">登入</button>
      </div>
    </form>
    <div class="hint" style="margin-top:16px"><a href="/">返回平台首頁</a></div>
  </main>

  <script src="/portal/js/portal.js"></script>
  <script>
    (() => {
      const redirectFor = (user) => {
        if (user.role === 'store') window.location.href = '/portal/store.html';
        if (user.role === 'buyer' || user.role === 'sct') window.location.href = '/portal/reviewer.html';
      };
      portal.me()
        .then((data) => redirectFor(data.user))
        .catch(() => {});

      document.getElementById('login_form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = '登入中…';
        portal.showAlert(document.getElementById('login_error'), '', '');
        try {
          const data = await portal.api('/api/portal/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username: document.getElementById('username').value.trim() }),
          });
          redirectFor(data.user);
        } catch (err) {
          portal.showAlert(document.getElementById('login_error'), 'error', portal.escapeHtml(err.message));
        } finally {
          btn.disabled = false;
          btn.textContent = '登入';
        }
      });
    })();
  </script>
</body>
</html>
