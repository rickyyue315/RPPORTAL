<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">RP Type 條件欄位</title>
  <desc id="desc">ND 和 RF 的必填欄位示意</desc>
  <rect width="640" height="360" rx="16" fill="#f4f7fa"/>
  <rect x="30" y="28" width="580" height="304" rx="12" fill="#fff" stroke="#d9dee3"/>
  <text x="58" y="68" fill="#0a3d69" font-family="Arial, sans-serif" font-size="18" font-weight="700">按 RP Type 填寫欄位</text>
  <text x="58" y="108" fill="#1d2733" font-family="Arial, sans-serif" font-size="15" font-weight="700">RP Type</text>
  <rect x="58" y="120" width="190" height="42" rx="6" fill="#fff" stroke="#0f5c9c" stroke-width="2"/>
  <text x="78" y="147" fill="#1d2733" font-family="Arial, sans-serif" font-size="17" font-weight="700">RF</text>
  <text x="58" y="202" fill="#1d2733" font-family="Arial, sans-serif" font-size="15" font-weight="700">Safety stock</text>
  <rect x="58" y="214" width="190" height="42" rx="6" fill="#fff" stroke="#1e8449" stroke-width="3"/>
  <text x="78" y="241" fill="#1d2733" font-family="Arial, sans-serif" font-size="17">5</text>
  <rect x="316" y="98" width="250" height="78" rx="9" fill="#eaf2fb"/>
  <text x="338" y="128" fill="#0a3d69" font-family="Arial, sans-serif" font-size="16" font-weight="700">ND</text>
  <text x="338" y="153" fill="#1d2733" font-family="Arial, sans-serif" font-size="14">要填 ND Code</text>
  <rect x="316" y="194" width="250" height="78" rx="9" fill="#eafaf1"/>
  <text x="338" y="224" fill="#1e8449" font-family="Arial, sans-serif" font-size="16" font-weight="700">RF</text>
  <text x="338" y="249" fill="#1d2733" font-family="Arial, sans-serif" font-size="14">Safety stock &gt; 0</text>
  <text x="58" y="300" fill="#66727f" font-family="Arial, sans-serif" font-size="13">指定店舖轉 RF 時，Remark 也必須填寫</text>
</svg>
