<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更改密碼</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/portal/css/portal.css">
</head>
<body class="portal-login-body">
  <main class="portal-login-card">
    <h1>更改密碼</h1>
    <p class="hint">首次登入必須更改密碼，更改後才能使用申報／審批功能。</p>
    <div id="pw_error"></div>
    <form id="pw_form">
      <label for="current_password">現有密碼</label>
      <input type="password" id="current_password" autocomplete="current-password">
      <label for="new_password">新密碼</label>
      <input type="password" id="new_password" autocomplete="new-password">
      <div class="btn-row" style="margin-top:16px">
        <button class="btn" type="submit">更改密碼</button>
      </div>
    </form>
    <div class="hint" style="margin-top:16px"><a href="/portal/">返回登入</a></div>
  </main>

  <script src="/portal/js/portal.js"></script>
  <script>
    (() => {
      document.getElementById('pw_form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = '提交中…';
        portal.showAlert(document.getElementById('pw_error'), '', '');
        try {
          await portal.api('/api/portal/auth/change-password', {
            method: 'POST',
            body: JSON.stringify({
              current_password: document.getElementById('current_password').value,
              new_password: document.getElementById('new_password').value,
            }),
          });
          const me = await portal.me();
          if (me.user.role === 'store') window.location.href = '/portal/store.html';
          else window.location.href = '/portal/reviewer.html';
        } catch (err) {
          portal.showAlert(document.getElementById('pw_error'), 'error', portal.escapeHtml(err.message));
        } finally {
          btn.disabled = false;
          btn.textContent = '更改密碼';
        }
      });
    })();
  </script>
</body>
</html>
