<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Urgent Order 表格</title>
  <desc id="desc">填寫緊急補貨資料的示意圖</desc>
  <rect width="640" height="360" rx="16" fill="#f4f7fa"/>
  <rect x="38" y="28" width="564" height="304" rx="12" fill="#fff" stroke="#d9dee3"/>
  <rect x="38" y="28" width="564" height="50" rx="12" fill="#b85c00"/>
  <text x="64" y="60" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Urgent Order</text>
  <text x="70" y="116" fill="#1d2733" font-family="Arial, sans-serif" font-size="14" font-weight="700">Site Code</text>
  <rect x="70" y="128" width="190" height="42" rx="6" fill="#fff" stroke="#b85c00" stroke-width="2"/>
  <text x="88" y="155" fill="#1d2733" font-family="Arial, sans-serif" font-size="17">HA02</text>
  <text x="292" y="116" fill="#1d2733" font-family="Arial, sans-serif" font-size="14" font-weight="700">SKU</text>
  <rect x="292" y="128" width="250" height="42" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="2"/>
  <text x="310" y="155" fill="#1d2733" font-family="Arial, sans-serif" font-size="17">123456789</text>
  <text x="70" y="214" fill="#1d2733" font-family="Arial, sans-serif" font-size="14" font-weight="700">QTY（1 - 1000）</text>
  <rect x="70" y="226" width="190" height="42" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="2"/>
  <text x="88" y="253" fill="#1d2733" font-family="Arial, sans-serif" font-size="17">8</text>
  <rect x="292" y="226" width="250" height="42" rx="6" fill="#fff" stroke="#d9dee3" stroke-width="2"/>
  <text x="310" y="253" fill="#1d2733" font-family="Arial, sans-serif" font-size="15">Urgent Reason ▼</text>
  <text x="70" y="302" fill="#b85c00" font-family="Arial, sans-serif" font-size="13" font-weight="700">14:30 後暫停收單</text>
</svg>
