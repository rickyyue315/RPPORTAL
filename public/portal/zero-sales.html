<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Portal — 90日零銷售回覆</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/portal/css/portal.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <div>
          <h1>NDRF Store Portal</h1>
          <div class="subtitle" id="store_header">90日零銷售回覆</div>
        </div>
      </div>
      <nav aria-label="主要導覽">
        <a href="/portal/zero-sales.html" class="active" aria-current="page">零銷售回覆</a>
        <a href="/portal/store.html">一般NDRF · 暫停</a>
        <a href="/urgent.html">Urgent · 暫停</a>
        <a href="/sales.html">突發性銷售 · 暫停</a>
        <a href="/return.html">行貨退貨 · 暫停</a>
        <a href="/lookup.html">查詢／修改</a>
        <a href="/help.html">使用說明</a>
        <a href="#" id="logout_link">登出</a>
        <a href="/">平台首頁</a>
      </nav>
    </div>
  </header>

  <main class="container portal-main" style="max-width:1200px">
    <div class="card zs-head-card">
      <h2>90日零銷售 SKU 回覆</h2>
      <div id="site_info"><div class="loading">載入中…</div></div>
      <div class="zs-progress" aria-hidden="true"><i id="zs_progress_bar" style="width:0%"></i></div>
      <p class="hint" style="margin-bottom:0">RP Team 每週派發你店舖的指定零銷售 SKU，請逐條選擇原因並可填補充說明。每 SKU 可修改一次（初次回覆 + 1 次修改），用完後會鎖定，如需再改請聯絡 RP Team。</p>

      <div class="zs-toolbar" role="search">
        <div class="field">
          <label for="f_status">狀態篩選</label>
          <select id="f_status"><option value="">全部</option><option value="pending">未回覆</option><option value="replied">已回覆</option></select>
        </div>
        <div class="field field--search">
          <label for="f_search">搜尋 SKU / Brand / 描述</label>
          <input type="text" id="f_search" placeholder="例如 1234567、EYG…" autocomplete="off">
        </div>
        <div>
          <button class="btn btn-sm" id="btn_refresh" type="button" style="min-height:42px;padding:10px 22px;font-size:14px;border-radius:999px">重新整理</button>
        </div>
      </div>
      <div id="list_error"></div>
      <div class="zs-table-wrap"><div id="zs_list"><div class="loading" style="padding:28px;text-align:center">載入中…</div></div></div>
      <p class="hint" id="zs_count" style="margin-bottom:0"></p>
    </div>
  </main>

  <dialog id="reply_dialog" aria-labelledby="reply_title">
    <div class="reply-head">
      <h3 id="reply_title">回覆</h3>
      <div id="reply_sku_info" class="hint"></div>
    </div>
    <div class="reply-body">
      <div style="margin:0 0 12px">
        <label for="reply_reason">回覆原因 <span class="optional">（必選）</span></label>
        <select id="reply_reason" style="width:100%"></select>
      </div>
      <div style="margin:12px 0">
        <label for="reply_note">補充說明</label>
        <textarea id="reply_note" rows="3" style="width:100%" maxlength="2000" placeholder="例如：已安排陳列 / 待清貨…"></textarea>
      </div>
      <div id="reply_error"></div>
      <div class="btn-row" style="justify-content:flex-end">
        <button class="btn ghost btn-sm" id="btn_reply_cancel" type="button">取消</button>
        <button class="btn btn-sm" id="btn_reply_save" type="button" style="min-height:36px;border-radius:8px">儲存回覆</button>
      </div>
    </div>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/portal/js/portal.js"></script>
  <script src="/portal/js/zero-sales.js"></script>
  <footer class="site-footer">Developed by RP Team - Ricky Yue</footer>
</body>
</html>
