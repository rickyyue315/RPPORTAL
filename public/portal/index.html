<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDRF Portal 登入</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/portal/css/portal.css">
</head>
<body class="portal-login-body">
  <main class="portal-login-card">
    <h1>NDRF 申報 Portal</h1>
    <p class="hint" id="login_hint">店舖只需輸入使用者名稱（店舖 Site Code），免密碼登入；Buyer／SCT 請輸入使用者名稱及密碼。</p>
    <div id="login_error"></div>
    <form id="login_form">
      <label for="username">使用者名稱</label>
      <input type="text" id="username" autocomplete="username" placeholder="例如 HA02 / BUYER1">
      <label for="password" id="password_label">密碼（店舖免填；Buyer／SCT 必填）</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="店舖請留空">
      <div class="btn-row" style="margin-top:16px">
        <button class="btn" type="submit">登入</button>
      </div>
    </form>
    <div class="hint" style="margin-top:16px"><a href="/">返回平台首頁</a></div>
  </main>

  <script src="/js/options.js"></script>
  <script src="/portal/js/portal.js"></script>
  <script>
    (() => {
      const bypass = globalThis.NDRF_OPTIONS?.portalAuthBypass === true;
      const redirectFor = (user) => {
        if (user.role === 'store') window.location.href = '/portal/store.html';
        if (user.role === 'buyer' || user.role === 'sct') window.location.href = '/portal/reviewer.html';
      };
      if (bypass) {
        document.getElementById('password_label').style.display = 'none';
        document.getElementById('password').style.display = 'none';
        document.getElementById('login_hint').textContent = '暫時免密碼登入：只需輸入使用者名稱（例如 HA02 / BUYER1）即可進入。';
      }
      portal.me()
        .then((data) => redirectFor(data.user))
        .catch(() => {});

      document.getElementById('login_form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = '登入中…';
        portal.showAlert(document.getElementById('login_error'), '', '');
        try {
          // Store accounts are passwordless: the password is optional and
          // ignored for store logins. Buyer / SCT must supply it.
          const body = bypass
            ? { username: document.getElementById('username').value.trim() }
            : {
              username: document.getElementById('username').value.trim(),
              password: document.getElementById('password').value,
            };
          const data = await portal.api('/api/portal/auth/login', {
            method: 'POST',
            body: JSON.stringify(body),
          });
          if (data.user.role !== 'store' && data.user.must_change_password) {
            window.location.href = '/portal/change-password.html';
            return;
          }
          redirectFor(data.user);
        } catch (err) {
          portal.showAlert(document.getElementById('login_error'), 'error', portal.escapeHtml(err.message));
        } finally {
          btn.disabled = false;
          btn.textContent = '登入';
        }
      });
    })();
  </script>
</body>
</html>
