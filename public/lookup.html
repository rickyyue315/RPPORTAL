<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>查詢／修改 — NDRF 申報平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>NDRF 申報平台</h1>
      <div class="subtitle">查詢／修改申報</div>
    </div>
    <nav>
      <a href="/">一般申報</a>
      <a href="/urgent.html">Urgent Order</a>
      <a href="/sales.html">突發性銷售申報</a>
      <a href="/lookup.html" class="active" aria-current="page">查詢／修改</a>
      <a href="/help.html">使用說明</a>
    </nav>
  </header>

  <main class="container">
    <div class="card" id="search_card">
      <h2>查詢申報</h2>
      <p class="hint">輸入申請編號及申請時的 Site Code。</p>
      <div id="search_error"></div>
      <form id="search_form">
        <div class="form-grid">
          <div>
            <label for="q_no">申請編號</label>
          <input type="text" id="q_no" placeholder="NDRF-...、URGENT-... 或 SALES-...">
          </div>
          <div>
            <label for="q_site">Site Code</label>
            <input type="text" id="q_site" placeholder="例如 HA02">
          </div>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn">查詢</button>
        </div>
      </form>
    </div>

    <div class="card" id="detail_card" style="display:none">
      <h2>申報詳情</h2>
      <div id="lock_banner"></div>
      <div class="dl" id="detail_header"></div>

      <h3>目前資料</h3>
      <div id="edit_error"></div>
      <form id="edit_form" class="form-grid">
        <div>
          <label for="f_sku">SKU <span class="optional">（必填）</span></label>
          <input type="text" id="f_sku">
        </div>
        <div class="full">
          <div class="form-grid" id="normal_fields">
            <div>
              <label for="f_rp_type">RP Type <span class="optional">（必填）</span></label>
              <select id="f_rp_type">
                <option value="">—</option>
                <option value="ND">ND</option>
                <option value="RF">RF</option>
              </select>
            </div>
            <div>
              <label for="f_safety_stock">Safety stock</label>
              <input type="text" id="f_safety_stock">
            </div>
            <div>
              <label for="f_nd_code">ND Code</label>
              <input type="text" id="f_nd_code" list="nd_code_list">
              <datalist id="nd_code_list"></datalist>
            </div>
            <div class="full">
              <label for="f_remark">Remark</label>
              <input type="text" id="f_remark">
            </div>
          </div>
          <div class="form-grid" id="urgent_fields" style="display:none">
            <div>
              <label for="f_u_qty">QTY <span class="optional">（必填，1 至 1000）</span></label>
              <input type="number" id="f_u_qty" min="1" max="1000" step="1" inputmode="numeric" autocomplete="off">
            </div>
            <div class="full">
              <label for="f_u_urgent_reason">Urgent Reason <span class="optional">（必填）</span></label>
              <select id="f_u_urgent_reason">
                <option value="">請選擇申請原因</option>
                <option value="1">1. 客人訂購 (RP Team定期隨機抽查核實)</option>
                <option value="2">2. ROADSHOW</option>
                <option value="3">3. 追數 (OM指定)</option>
                <option value="4">4. Promotion</option>
                <option value="5">5. 新舖落貨(只限開舖第一週)</option>
                <option value="6">6. 新產品SAP無法落貨</option>
                <option value="7">7. 大堆頭擺放</option>
                <option value="8">8. 管理層要求(只限Portal落貨)(缺貨)</option>
                <option value="9">9. 其他</option>
              </select>
            </div>
            <div class="full" id="f_u_other_wrap" style="display:none">
              <label for="f_u_urgent_reason_other">Other Reason <span class="optional">（選擇「9. 其他」時必填）</span></label>
              <input type="text" id="f_u_urgent_reason_other" autocomplete="off" maxlength="2000">
            </div>
          </div>
        </div>
      </form>

      <div id="modify_box">
        <div class="btn-row">
          <button class="btn" id="btn_save">儲存修改</button>
          <span class="hint" id="save_note"></span>
        </div>
        <div id="save_error"></div>
      </div>

      <h3>版本歷史</h3>
      <table id="versions_table">
        <thead>
          <tr><th>版本</th><th>修改日期時間 (HK)</th><th>操作者</th><th>修改來源</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="btn-row">
        <button class="btn secondary" id="btn_back">返回查詢</button>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/lookup.js"></script>
</body>
</html>
