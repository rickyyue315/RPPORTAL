services:
  db:
    image: postgres:16-alpine
    container_name: ndrf-db
    environment:
      POSTGRES_USER: ndrf
      POSTGRES_PASSWORD: ndrf
      POSTGRES_DB: ndrf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ndrf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndrf"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: ndrf-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ndrf:ndrf@db:5432/ndrf
      ADMIN_USERNAME: admin
      # 不提供預設密碼；留空 = 管理員登入停用（fail-closed）。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 沒有預設值；Store／OM 已改用個人密碼，共用登入預設關閉。
      PORTAL_SHARED_PASSWORD: ${PORTAL_SHARED_PASSWORD:-}
      PORTAL_OM_PASSWORD: ${PORTAL_OM_PASSWORD:-}
      PORTAL_STORE_SHARED_PASSWORD_ENABLED: "false"
      PORTAL_OM_SHARED_PASSWORD_ENABLED: "false"
      TRUST_PROXY: "false"
      PUBLIC_WRITE_SUSPENSION_ENABLED: "true"
      PUBLIC_WRITE_SUSPENSION_AT: "2026-08-11T23:59:59+08:00"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  ndrf_pgdata:
